<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Birthday</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ff7aa2, #ffd166);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }
    .card {
      background: rgba(0,0,0,0.2);
      padding: 30px 40px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.25);
    }
    button {
      margin-top: 20px;
      padding: 10px 20px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Happy Birthday!</h1>
    <p>Enjoy the birthday tune.</p>
    <button onclick="playTune()">Play Birthday Tune</button>
    <audio id="birthdayAudio" src="birthday-song.mp3" preload="auto"></audio>
  </div>

  <script>
    function playTune() {
      const audio = document.getElementById('birthdayAudio');
      audio.currentTime = 0;
      audio.play().catch(() => {
        console.log('Audio playback was blocked. Click the button to try again.');
      });
    }

    window.addEventListener('load', () => {
      playTune();
    });
  </script>
</body>
</html>
